# Mantém o n8n no plano free da Render acordado (dorme após ~15 min).
# Com o app ligado, o n8n consulta o Postgres e o Supabase não pausa.
# O GitHub às vezes atrasa o cron; 5 min deixa folga na janela de 15.
name: Keep n8n awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping n8n on Render
        env:
          N8N_URL: https://n8n-wwzm.onrender.com/healthz
        run: |
          curl -fsS --retry 8 --retry-all-errors --retry-delay 10 --max-time 90 "$N8N_URL"
