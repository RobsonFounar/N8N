# n8n self-hosted no Render (este repositório apenas — não misturar com outros apps).
#
# Banco: Supabase project "n8n" (ref togomiokchincpaspwao), via Session pooler IPv4.
# O host direto db.*.supabase.co é IPv6 e a Render não alcança.
#
# Apply: https://dashboard.render.com/blueprint/new?repo=https://github.com/RobsonFounar/N8N

services:
  - type: web
    name: n8n
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      # NÃO altere N8N_ENCRYPTION_KEY depois do primeiro deploy:
      # credenciais criptografadas ficam ilegíveis se a chave mudar.
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: TZ
        value: America/Sao_Paulo
      - key: GENERIC_TIMEZONE
        value: America/Sao_Paulo
      - key: N8N_LISTEN_ADDRESS
        value: "0.0.0.0"
      - key: N8N_HOST
        value: n8n-wwzm.onrender.com
      - key: WEBHOOK_URL
        value: https://n8n-wwzm.onrender.com/
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-wwzm.onrender.com/
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PROXY_HOPS
        value: "1"
      # 1.x ainda aceita desligar runners. No 2.x isso é ignorado e o processo morre em 512 MB.
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_VERSION_NOTIFICATIONS_ENABLED
        value: "false"
      - key: N8N_TEMPLATES_ENABLED
        value: "false"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: DB_POSTGRESDB_POOL_SIZE
        value: "2"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=320 --dns-result-order=ipv4first"
      - key: DB_TYPE
        value: postgresdb
      - key: SUPABASE_PROJECT_REF
        value: togomiokchincpaspwao
      - key: DB_POSTGRESDB_HOST
        value: aws-0-us-west-1.pooler.supabase.com
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_USER
        value: postgres.togomiokchincpaspwao
      # Senha do Postgres do Supabase — só no Dashboard, nunca neste arquivo.
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"

# O Postgres n8n-db da Render ficou de legado. Não está mais ligado ao web service.
# Pode apagar no Dashboard quando o n8n estiver estável no Supabase.
databases:
  - name: n8n-db
    plan: free
    databaseName: n8n
    user: n8n
